<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de Tabela</title>
</head>
<style>
    table {
        font-family: Arial, Helvetica, sans-serif;
        border-collapse: collapse;
       
    }

    th, td {
        border: 1px solid black;
        padding: 10px;
        
    }

    .principal {
        background-color: grey;
        color: white;
    }

    .nota {
        text-align: center;
    }


    caption {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 1.5em;
        font-weight: bold;
        padding: 15px;

    }
</style>
<body>
    <table>
        <caption>Notas do 1º Semestre</caption>
        <thead>
            <tr>
                <th class="principal" rowspan="2" >Área</th>
                <th class="principal" rowspan="2">Disciplinas</th>
                <th colspan="2" class="principal">Notas</th>
                <th class="principal" rowspan="2">Média</th>
            </tr>
            <tr>
                <th class="principal" >Nível 1</th>
                <th class="principal" >Nível 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td>Matemática</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
            </tr>
            <tr>
                <th colspan="4" class="principal">Média de Exatas</th>
                <th class="principal">0.0</th>
            </tr>
            <tr>
                <th rowspan="2">Humanas</th>
                <td>História</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
            </tr>
        </tbody>
            <tr>
                <th colspan="4" class="principal">Média de Humanas</th>
                <th class="principal">0.0</th>
            </tr>
    </table>
    
</body>
</html>
