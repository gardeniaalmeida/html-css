<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagem de Tabelas D03</title>
</head>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
    }

    td, th {
        border: 1px solid grey;
        padding: 10px;
        text-align: center;
    }

    th {
        background-color: rgb(231, 230, 230);
    }

    .rosa {
        background-color: pink;
    }

    .azul {
        background-color: rgb(77, 136, 224);
    }

    caption {
        font-size: 1.3em;
        font-weight: bold;
        padding: 10px;
    }

    table {
        border-collapse: collapse;
    }
</style>
<body>
    <table>
        <caption>
            Filmes Favoritos
        </caption>
        <thead>
            <tr>
                <th scope="col">Grupo</th>
                <th scope="col">Nomes</th>
                <th colspan="3" scope="colgroup">Filmes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="3" class="rosa" scope="rowgroup">Mulheres</th>
                <td>Ana Maria Santos</td>
                <td>Alien</td>
                <td>Rambo</td>
                <td>Vingadores</td>
            </tr>
             <tr>
                <td>Beatriz Souza</td>
                <td>Hulk</td>
                <td>Inception</td>
                <td>Batman</td>
            </tr>
             <tr>
                <td>Cláudia Melo</td>
                <td>Oblivion</td>
                <td>Matrix</td>
                <td>Big Hero</td>
            <tr>
                <th rowspan="3" class="azul" scope="rowgroup">Homens</th>
                <td>Bruno Mendonça</td>
                <td>Intocáveis</td>
                <td>Amnésia</td>
                <td>Gladiador</td>
           </tr>
            <tr>
                <td>Daniel Lourenço</td>
                <td>Wall-E</td>
                <td>Oldboy</td>
                <td>Dangal</td>
           </tr>
           <tr>
                <td>Fabiano Mota</td>
                <td>Star Wars 5</td>
                <td>Taxi Driver</td>
                <td>Toy Story</td>
           </tr>
           
        </tbody>
    </table>
    
</body>
</html>
