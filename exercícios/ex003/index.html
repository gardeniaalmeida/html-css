<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste com Imagens</title>
</head>
<body>
    <h1>Testando carga de imagens</h1>
    <p>Abaixo você verá uma imagem que está na mesma pasta:</p>
    <img src="logo html full 200.webp" alt="logo html">
    <p>Podemos também carregar imagens que estão em subpastas:</p>
    <img src="imagens/logo css full 189.webp" alt="logo css">
    <p>Também podemos carregar imagens externas:</p>
    <img src="https://cdn.iconscout.com/icon/free/png-256/free-javascript-logo-icon-svg-download-png-1720087.png" alt="Logo JavaScript">
</body>
</html>
